version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Warsaw"
    exclude-paths:
      - "apps/examples/**"
    open-pull-requests-limit: 10

  - package-ecosystem: "npm"
    directory: "/apps/eden/bridge"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 10
