name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  LINUXCNC_REPOSITORY: LinuxCNC/linuxcnc
  LINUXCNC_CACHE_VERSION: v4

jobs:
  biome:
    name: Biome format and lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check formatting and lint
        run: pnpm run check

  patch-stack:
    name: LinuxCNC patch stack tooling
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test patch stack tooling
        run: ./linuxcnc-patches/test-stack.sh

  native-contract:
    name: Native gRPC contract
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Install LLVM and Clang 21
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "21"

      - name: Install C++ gRPC and Clang toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            libboost-dev \
            libgrpc++-dev \
            libgrpc-dev \
            libprotobuf-dev \
            protobuf-compiler \
            protobuf-compiler-grpc

      - name: Check native formatting
        run: pnpm check:native:format
        env:
          CLANG_FORMAT: clang-format

      - name: Configure
        run: |
          cmake -S . -B build/native-grpc \
            -DLINUXCNC_GRPC_BUILD_WIRE=ON \
            -DLINUXCNC_GRPC_ENABLE_NML=OFF \
            -DLINUXCNC_GRPC_BUILD_TESTS=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build/native-grpc --parallel 2

      - name: Lint native sources
        run: pnpm lint:native build/native-grpc
        env:
          CLANG_TIDY: clang-tidy
          RUN_CLANG_TIDY: run-clang-tidy

      - name: Test
        run: ctest --test-dir build/native-grpc --output-on-failure

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm run typecheck

  test:
    name: Test
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read LinuxCNC base revision
        id: linuxcnc-baseline
        shell: bash
        run: |
          revision="$(< linuxcnc-patches/base-revision)"
          echo "revision=${revision}" >> "${GITHUB_OUTPUT}"

      - name: Install native daemon and Clang dependencies
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "21"

      - name: Install native daemon dependencies
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            libboost-dev \
            libgrpc++-dev \
            libgrpc-dev \
            libprotobuf-dev \
            protobuf-compiler \
            protobuf-compiler-grpc \
            python3-dev

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Restore LinuxCNC build
        id: linuxcnc-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/linuxcnc/${{ steps.linuxcnc-baseline.outputs.revision }}/linuxcnc
          key: linuxcnc-${{ runner.os }}-${{ runner.arch }}-${{ steps.linuxcnc-baseline.outputs.revision }}-${{ env.LINUXCNC_CACHE_VERSION }}-${{ hashFiles('linuxcnc-patches/*.patch') }}

      - name: Check out LinuxCNC
        if: steps.linuxcnc-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          LINUXCNC_DIR: ${{ github.workspace }}/.cache/linuxcnc/${{ steps.linuxcnc-baseline.outputs.revision }}/linuxcnc
          LINUXCNC_REF: ${{ steps.linuxcnc-baseline.outputs.revision }}
        run: |
          set -euo pipefail

          mkdir -p "$(dirname "${LINUXCNC_DIR}")"
          git clone "https://github.com/${LINUXCNC_REPOSITORY}.git" "${LINUXCNC_DIR}"
          git -C "${LINUXCNC_DIR}" checkout "${LINUXCNC_REF}"

      - name: Apply LinuxCNC patches
        if: steps.linuxcnc-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          LINUXCNC_DIR: ${{ github.workspace }}/.cache/linuxcnc/${{ steps.linuxcnc-baseline.outputs.revision }}/linuxcnc
          LINUXCNC_REF: ${{ steps.linuxcnc-baseline.outputs.revision }}
        run: |
          set -euo pipefail

          "${GITHUB_WORKSPACE}/linuxcnc-patches/apply.sh" --detach "${LINUXCNC_DIR}"

          patch_count="$(find "${GITHUB_WORKSPACE}/linuxcnc-patches" -maxdepth 1 -name '*.patch' | wc -l)"
          commit_count="$(git -C "${LINUXCNC_DIR}" rev-list --count "${LINUXCNC_REF}..HEAD")"
          test "${commit_count}" -eq "${patch_count}"
          test -z "$(git -C "${LINUXCNC_DIR}" status --porcelain --untracked-files=all)"

      - name: Install LinuxCNC build dependencies
        if: steps.linuxcnc-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          LINUXCNC_DIR: ${{ github.workspace }}/.cache/linuxcnc/${{ steps.linuxcnc-baseline.outputs.revision }}/linuxcnc
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y build-essential dpkg-dev

          cd "${LINUXCNC_DIR}"
          export DEB_BUILD_PROFILES="pkg.linuxcnc.headless nodoc"
          ./debian/configure no-docs
          if ! sudo env DEB_BUILD_PROFILES="${DEB_BUILD_PROFILES}" apt-get -P "pkg.linuxcnc.headless,nodoc" build-dep -y --no-install-recommends .; then
            dpkg-checkbuilddeps || true
            exit 1
          fi

      - name: Install LinuxCNC cached runtime dependencies
        if: steps.linuxcnc-cache.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            python3-dev \
            procps \
            psmisc \
            libboost-python-dev \
            libedit2 \
            libfmt9 \
            libmodbus5 \
            libtirpc3t64 \
            libudev1 \
            libusb-1.0-0

      - name: Build LinuxCNC
        if: steps.linuxcnc-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          LINUXCNC_DIR: ${{ github.workspace }}/.cache/linuxcnc/${{ steps.linuxcnc-baseline.outputs.revision }}/linuxcnc
        run: |
          set -euo pipefail

          cd "${LINUXCNC_DIR}/src"
          ./autogen.sh
          ./configure --with-realtime=uspace \
            --enable-headless \
            --disable-build-documentation \
            --disable-build-manpages
          make -j"$(nproc)"

      - name: Set LinuxCNC runtime permissions
        shell: bash
        env:
          LINUXCNC_DIR: ${{ github.workspace }}/.cache/linuxcnc/${{ steps.linuxcnc-baseline.outputs.revision }}/linuxcnc
        run: |
          set -euo pipefail

          cd "${LINUXCNC_DIR}/src"
          sudo make setuid

      - name: Configure native LinuxCNC daemon
        shell: bash
        env:
          LINUXCNC_DIR: ${{ github.workspace }}/.cache/linuxcnc/${{ steps.linuxcnc-baseline.outputs.revision }}/linuxcnc
        run: |
          set -euo pipefail

          cmake -S . -B build/native-grpc-linuxcnc \
            -DLINUXCNC_ROOT="${LINUXCNC_DIR}" \
            -DLINUXCNC_GRPC_BUILD_WIRE=ON \
            -DLINUXCNC_GRPC_BUILD_TESTS=ON \
            -DLINUXCNC_GRPC_ENABLE_NML=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build native LinuxCNC daemon
        run: cmake --build build/native-grpc-linuxcnc --parallel 2

      - name: Lint native LinuxCNC sources
        run: pnpm lint:native build/native-grpc-linuxcnc
        env:
          CLANG_TIDY: clang-tidy
          RUN_CLANG_TIDY: run-clang-tidy

      - name: Test native LinuxCNC daemon
        shell: bash
        env:
          LINUXCNC_DIR: ${{ github.workspace }}/.cache/linuxcnc/${{ steps.linuxcnc-baseline.outputs.revision }}/linuxcnc
        run: |
          set -euo pipefail

          set +u
          source "${LINUXCNC_DIR}/scripts/rip-environment"
          set -u
          export LINUXCNC_INCLUDE="${LINUXCNC_DIR}/include"
          export LINUXCNC_LIB="${LINUXCNC_DIR}/lib"
          ctest --test-dir build/native-grpc-linuxcnc --output-on-failure

      - name: Save LinuxCNC build
        if: steps.linuxcnc-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .cache/linuxcnc/${{ steps.linuxcnc-baseline.outputs.revision }}/linuxcnc
          key: linuxcnc-${{ runner.os }}-${{ runner.arch }}-${{ steps.linuxcnc-baseline.outputs.revision }}-${{ env.LINUXCNC_CACHE_VERSION }}-${{ hashFiles('linuxcnc-patches/*.patch') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

  container:
    name: linuxcnc-simulator container
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          load: true
          tags: linuxcnc-simulator:test
          cache-from: type=gha,scope=linuxcnc-simulator-amd64
          cache-to: type=gha,mode=max,scope=linuxcnc-simulator-amd64

      - name: Run full-stack container acceptance test
        run: ./docker/acceptance-test.sh linuxcnc-simulator:test
