name: Publish linuxcnc-simulator

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

concurrency:
  group: linuxcnc-simulator-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/b0czek/linuxcnc-simulator

jobs:
  build:
    name: Build and test ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          platforms: ${{ matrix.platform }}
          load: true
          tags: linuxcnc-simulator:test
          cache-from: type=gha,scope=linuxcnc-simulator-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=linuxcnc-simulator-${{ matrix.suffix }}

      - name: Run full-stack container smoke test
        run: ./docker/smoke-test.sh linuxcnc-simulator:test

      - name: Build and push platform image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=linuxcnc-simulator-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=linuxcnc-simulator-${{ matrix.suffix }}
          provenance: mode=max

      - name: Export digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: linuxcnc-simulator-digest-${{ matrix.suffix }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Publish multi-platform manifest
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: linuxcnc-simulator-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image tags
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Create manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          tag_args=()
          while IFS= read -r tag; do
            [[ -n "${tag}" ]] && tag_args+=(--tag "${tag}")
          done <<< "${IMAGE_TAGS}"
          image_args=()
          for digest in *; do
            image_args+=("${{ env.IMAGE_NAME }}@sha256:${digest}")
          done
          docker buildx imagetools create "${tag_args[@]}" "${image_args[@]}"

      - name: Inspect published image
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: docker buildx imagetools inspect "$(head -n 1 <<< "${IMAGE_TAGS}")"
