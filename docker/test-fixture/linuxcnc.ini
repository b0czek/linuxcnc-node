[EMC]
MACHINE = linuxcnc-simulator-container-acceptance
VERSION = 1.1
DEBUG = 0

[DISPLAY]
DISPLAY = linuxcnc-grpc-display
PROGRAM_PREFIX = /var/lib/linuxcnc-grpc/active-program

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[RS274NGC]
PARAMETER_FILE = sim_mm.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 4.0
BASE_PERIOD = 0
SERVO_PERIOD = 1000000

[EMCIO]
TOOL_TABLE = sim_mm.tbl

[HAL]
HALFILE = LIB:core_sim.hal

[TRAJ]
SPINDLES = 1
AXES = 3
COORDINATES = X Y Z
HOME = 0 0 0
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 30.48
MAX_LINEAR_VELOCITY = 53.34
NO_FORCE_HOMING = 1

[AXIS_X]
MIN_LIMIT = -254
MAX_LIMIT = 254
MAX_VELOCITY = 30.48
MAX_ACCELERATION = 508

[AXIS_Y]
MIN_LIMIT = -254
MAX_LIMIT = 254
MAX_VELOCITY = 30.48
MAX_ACCELERATION = 508

[AXIS_Z]
MIN_LIMIT = -50.8
MAX_LIMIT = 101.6
MAX_VELOCITY = 30.48
MAX_ACCELERATION = 508

[KINS]
KINEMATICS = trivkins
JOINTS = 3

[JOINT_0]
TYPE = LINEAR
HOME = 0
MAX_VELOCITY = 30.48
MAX_ACCELERATION = 508
MIN_LIMIT = -254
MAX_LIMIT = 254
FERROR = 1.27
MIN_FERROR = 0.254

[JOINT_1]
TYPE = LINEAR
HOME = 0
MAX_VELOCITY = 30.48
MAX_ACCELERATION = 508
MIN_LIMIT = -254
MAX_LIMIT = 254
FERROR = 1.27
MIN_FERROR = 0.254

[JOINT_2]
TYPE = LINEAR
HOME = 0
MAX_VELOCITY = 30.48
MAX_ACCELERATION = 508
MIN_LIMIT = -50.8
MAX_LIMIT = 101.6
FERROR = 1.27
MIN_FERROR = 0.254
