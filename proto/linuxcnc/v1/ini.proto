syntax = "proto3";
package linuxcnc.v1;
import "google/protobuf/empty.proto";

message IniEntry {
  string section = 1;
  string key = 2;
  string value = 3;
}

// Parsed active INI, including resolved includes and repeated keys in order.
message IniSnapshot { repeated IniEntry entries = 1; }

// Immutable for the daemon session. No request accepts a filename.
service IniService {
  rpc Read(google.protobuf.Empty) returns (IniSnapshot);
}
