syntax = "proto3";

package linuxcnc.v1;

import "linuxcnc/v1/common.proto";
import "google/protobuf/empty.proto";

enum ScopeRuntimeState {
  SCOPE_RUNTIME_STATE_UNSPECIFIED = 0;
  SCOPE_RUNTIME_STATE_IDLE = 1;
  SCOPE_RUNTIME_STATE_INIT = 2;
  SCOPE_RUNTIME_STATE_PRE_TRIGGER = 3;
  SCOPE_RUNTIME_STATE_TRIGGER_WAIT = 4;
  SCOPE_RUNTIME_STATE_POST_TRIGGER = 5;
  SCOPE_RUNTIME_STATE_DONE = 6;
  SCOPE_RUNTIME_STATE_RESET = 7;
  SCOPE_RUNTIME_STATE_INVALID = 8;
}

enum ScopeRunMode {
  SCOPE_RUN_MODE_UNSPECIFIED = 0;
  SCOPE_RUN_MODE_RUN = 1;
  SCOPE_RUN_MODE_SINGLE = 2;
  SCOPE_RUN_MODE_ROLL = 3;
}

message ScopeChannelConfig { uint32 index = 1; HalItemRef item = 2; bool enabled = 3; }

message ScopeAcquisitionConfig { string thread_name = 1; uint32 multiplier = 2; uint32 pre_trigger = 3; uint32 trigger_channel = 4; double trigger_level = 5; bool rising = 6; bool automatic = 7; repeated ScopeChannelConfig channels = 8; }

message ScopeStatus { ScopeRuntimeState state = 1; uint32 buffer_length = 2; uint32 record_length = 3; uint32 sample_length = 4; uint32 samples = 5; uint32 start = 6; uint32 multiplier = 7; uint32 watchdog = 8; string thread_name = 9; uint64 sample_period_ns = 10; }

message ScopeCapture { repeated PackedChannel channels = 1; uint32 samples = 2; uint32 trigger_index = 3; uint64 sample_period_ns = 4; uint64 generation = 5; uint64 skipped_frames = 6; }

message PackedChannel {
  // Original field 1 remains the sample payload for wire compatibility.
  repeated double values = 1 [packed = true];
  // Stable slot identity preserves null/disabled channel positions.
  uint32 index = 2;
  bool enabled = 3;
}

message ScopeCaptureDelta { repeated PackedChannel channels = 1; uint32 samples = 2; uint32 capacity = 3; uint64 sequence = 4; uint64 sample_period_ns = 5; bool reset = 6; uint64 generation = 7; uint64 skipped_frames = 8; }

message ScopeConfigure { ScopeAcquisitionConfig config = 1; }

message ScopeRun { ScopeRunMode mode = 1; }

message ScopeStop {}

message ScopeTrigger {}

message ScopeControlState {
  ScopeStatus status = 1;
  string websocket_path = 2;
}

service ScopeService {
  rpc GetStatus(google.protobuf.Empty) returns (ScopeControlState);
  rpc Configure(ScopeConfigure) returns (ScopeControlState);
  rpc Run(ScopeRun) returns (ScopeControlState);
  rpc Stop(ScopeStop) returns (ScopeControlState);
  rpc Trigger(ScopeTrigger) returns (ScopeControlState);
}
